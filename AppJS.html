<!-- AppJS.html - Shared JavaScript for SIGURU Apps Script -->
<script>
// ============================================================
// SIGURU Apps Script - Client-Side JavaScript
// ============================================================

// === SESSION MANAGEMENT ===
function getCurrentUser() {
  const userStr = localStorage.getItem('siguru_user');
  if (!userStr) return null;
  try { return JSON.parse(userStr); } catch(e) { return null; }
}

function requireLogin() {
  const user = getCurrentUser();
  if (!user || !user.username) {
    try {
      document.documentElement.style.display = 'none';
    } catch(e) {}
    navigateTo('login', { auth: 'required' });
    return { id: 0, username: '', nama: '', hak_akses: '', nip: '' };
  }
  checkCurrentPageAccess();
  return user;
}

function getBaseUrl() {
  if (window.SIGURU_SCRIPT_URL && window.SIGURU_SCRIPT_URL.indexOf('script.google.com') !== -1) {
    return window.SIGURU_SCRIPT_URL;
  }
  const cachedUrl = localStorage.getItem('siguru_script_url');
  if (cachedUrl && cachedUrl.indexOf('script.google.com') !== -1) {
    return cachedUrl;
  }
  try {
    if (window.top && window.top.location && window.top.location.href && window.top.location.href.indexOf('script.google.com') !== -1) {
      const topUrl = window.top.location.href.split('?')[0];
      localStorage.setItem('siguru_script_url', topUrl);
      return topUrl;
    }
  } catch(e) {}
  return window.location.href.split('?')[0];
}

function getCurrentPage() {
  if (window.SIGURU_CURRENT_PAGE) return window.SIGURU_CURRENT_PAGE;
  try {
    const p = new URLSearchParams(window.location.search).get('page');
    if (p) return p;
  } catch(e) {}
  try {
    if (window.top && window.top.location) {
      const pTop = new URLSearchParams(window.top.location.search).get('page');
      if (pTop) return pTop;
    }
  } catch(e) {}

  const stored = sessionStorage.getItem('siguru_current_page');
  if (stored) return stored;

  const titleEl = document.getElementById('headerPageTitle');
  if (titleEl && titleEl.textContent) {
    const t = titleEl.textContent.toLowerCase().trim();
    if (t.includes('dashboard')) return 'dashboard';
    if (t.includes('kehadiran') || t.includes('absen')) return 'laporan-absen';
    if (t.includes('jurnal')) return 'laporan-jurnal';
    if (t.includes('guru wali')) return 'laporan-guruwali';
    if (t.includes('wali kelas')) return 'laporan-wali';
    if (t.includes('ekstra')) return 'laporan-ekstra';
    if (t.includes('bimbingan')) return 'master-bimbingan';
    if (t.includes('siswa') || t.includes('murid')) return 'master-murid';
    if (t.includes('guru')) return 'master-guru';
    if (t.includes('pengaturan')) return 'pengaturan';
    if (t.includes('user') || t.includes('pengguna')) return 'user-management';
    if (t.includes('profil')) return 'profil';
  }
  return 'dashboard';
}

function reloadCurrentAppPage() {
  const page = getCurrentPage();
  sessionStorage.setItem('siguru_current_page', page);
  navigateTo(page);
}

function navigateTo(page, params) {
  try {
    sessionStorage.setItem('siguru_current_page', page);
  } catch(e) {}
  let base = getBaseUrl();
  let targetUrl = base + (base.includes('?') ? '&' : '?') + 'page=' + encodeURIComponent(page);
  if (params && typeof params === 'object') {
    for (const [k, v] of Object.entries(params)) {
      if (v !== undefined && v !== null) {
        targetUrl += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(v);
      }
    }
  }

  // Anchor target _top adalah navigasi teraman dari dalam iframe Apps Script
  try {
    const a = document.createElement('a');
    a.href = targetUrl;
    a.target = '_top';
    (document.body || document.documentElement).appendChild(a);
    a.click();
    setTimeout(() => a.remove(), 100);
  } catch(e) {
    try {
      window.top.location.href = targetUrl;
    } catch(e2) {
      window.location.href = targetUrl;
    }
  }
}

function logout() {
  localStorage.removeItem('siguru_user');
  sessionStorage.clear();
  navigateTo('login');
}

// === FAST CACHE & CLIENT BUNDLE (Instan 0 Detik) ===
window.SERVER_BUNDLE = window.SERVER_BUNDLE || null;

function getAppBundle() {
  if (window.SERVER_BUNDLE && typeof window.SERVER_BUNDLE === 'object') {
    if (window.SERVER_BUNDLE.guru && window.SERVER_BUNDLE.guru.length > 0) {
      return window.SERVER_BUNDLE;
    }
  }
  try {
    const raw = sessionStorage.getItem('siguru_app_bundle');
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && !parsed.error && parsed.guru && parsed.guru.length > 0) {
        return parsed;
      } else {
        sessionStorage.removeItem('siguru_app_bundle');
      }
    }
  } catch(e) {}
  return null;
}

function updateAppBundle(freshData) {
  if (!freshData || freshData.error) return;
  const current = getAppBundle() || {};
  const updated = Object.assign({}, current, freshData);
  window.SERVER_BUNDLE = updated;
  try {
    sessionStorage.setItem('siguru_app_bundle', JSON.stringify(updated));
  } catch(e) {}
}

function invalidateAppBundle() {
  window.SERVER_BUNDLE = null;
  try {
    sessionStorage.removeItem('siguru_app_bundle');
  } catch(e) {}
}

// Prefetch and cache official Apps Script Web App URL & check forbidden state
document.addEventListener('DOMContentLoaded', function() {
  if (!localStorage.getItem('siguru_script_url') && typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run.withSuccessHandler(function(url) {
      if (url) localStorage.setItem('siguru_script_url', url);
    }).getScriptUrl();
  }

  try {
    const params = window.SIGURU_PARAMS || {};
    if (params.auth === 'forbidden') {
      setTimeout(function() {
        if (typeof showToast === 'function') {
          showToast('error', 'Akses Ditolak: Anda tidak memiliki izin untuk membuka halaman tersebut.');
        } else if (typeof Swal !== 'undefined') {
          Swal.fire({
            icon: 'error',
            title: 'Akses Ditolak',
            text: 'Anda tidak memiliki izin untuk membuka halaman tersebut.',
            timer: 3500,
            toast: true,
            position: 'top-end',
            showConfirmButton: false
          });
        }
      }, 300);
    }
  } catch(e) {}
});

// === RBAC ACCESS CHECK ===
function isSuperAdmin() {
  const user = getCurrentUser();
  if (!user || !user.hak_akses) return false;
  const role = String(user.hak_akses).toLowerCase().trim();
  return role.includes('super admin') || role.includes('admin') || role.includes('pengelola') || role === 'sadmin';
}

function isViewer() {
  const user = getCurrentUser();
  if (!user || !user.hak_akses) return false;
  const role = String(user.hak_akses).toLowerCase().trim();
  return role.includes('pelihat') || role.includes('pengawas');
}

function hasAccess(module) {
  const user = getCurrentUser();
  if (!user) return false;
  if (isSuperAdmin()) return true;
  if (isViewer()) return module.startsWith('laporan');
  
  const role = String(user.hak_akses || 'Guru');
  const roles = role.split(',').map(r => r.trim().toLowerCase());
  const hasRole = (rName) => roles.includes(rName.toLowerCase());
  const hasPembina = roles.some(r => r.includes('pembina'));

  switch(module) {
    // 1. Grup Master Data
    case 'master_guru': 
      return false;
    case 'master_murid': 
      return hasRole('guru') || hasRole('wali kelas');
    case 'master_bimbingan': 
      return hasRole('guru wali');
    case 'master_ekstra': 
      return hasRole('pembina ekstra') || hasPembina;

    // 2. Grup Form Inputan
    case 'form_absen': 
      return hasRole('guru');
    case 'form_jurnal': 
      return hasRole('guru');
    case 'form_guruwali': 
      return hasRole('guru wali');
    case 'form_wali': 
      return hasRole('wali kelas');
    case 'form_ekstra': 
      return hasRole('pembina ekstra') || hasPembina;

    // 3. Grup Laporan Hasil
    case 'laporan_absen': 
      return hasRole('guru');
    case 'laporan_jurnal': 
      return hasRole('guru');
    case 'laporan_wali': 
      return hasRole('wali kelas');
    case 'laporan_guruwali': 
      return hasRole('guru wali');
    case 'laporan_ekstra': 
      return hasRole('pembina ekstra') || hasPembina;
    case 'laporan': 
      return hasRole('guru') || hasRole('wali kelas') || hasRole('guru wali') || hasRole('pembina ekstra') || hasPembina;

    // 4. Grup Pengaturan Sistem (Hanya Super Admin)
    case 'pengaturan': 
    case 'user_management': 
      return false;

    default: 
      return false;
  }
}

function getPageModule(page) {
  if (!page) return null;
  const p = String(page).toLowerCase().replace(/_/g, '-').trim();
  switch(p) {
    case 'master-guru': return 'master_guru';
    case 'master-murid': return 'master_murid';
    case 'master-bimbingan': return 'master_bimbingan';
    case 'master-ekstra': return 'master_ekstra';

    case 'form-absen': return 'form_absen';
    case 'form-jurnal': return 'form_jurnal';
    case 'form-guruwali': return 'form_guruwali';
    case 'form-wali': return 'form_wali';
    case 'form-ekstra': return 'form_ekstra';

    case 'laporan-absen': return 'laporan_absen';
    case 'laporan-jurnal': return 'laporan_jurnal';
    case 'laporan-wali': return 'laporan_wali';
    case 'laporan-guruwali': return 'laporan_guruwali';
    case 'laporan-ekstra': return 'laporan_ekstra';

    case 'pengaturan': return 'pengaturan';
    case 'user-management': return 'user_management';
    default: return null;
  }
}

function checkCurrentPageAccess() {
  const user = getCurrentUser();
  if (!user || !user.username) return true;
  if (isSuperAdmin()) return true;

  const page = getCurrentPage();
  const mod = getPageModule(page);
  if (!mod) return true;

  if (!hasAccess(mod)) {
    try {
      document.documentElement.style.display = 'none';
    } catch(e) {}
    alert('Akses Ditolak: Hak akses akun Anda (' + (user.hak_akses || 'Guru') + ') tidak diizinkan membuka menu ini.');
    navigateTo('dashboard');
    return false;
  }
  return true;
}

function canManageReport(type, record) {
  const user = getCurrentUser();
  if (!user) return false;
  if (isSuperAdmin()) return true;
  
  const role = String(user.hak_akses || '').toLowerCase().trim();
  if (role.includes('pelihat') || role.includes('pengawas')) return false;

  const nama = String(user.nama || '').trim().toLowerCase();
  
  switch(type) {
    case 'jurnal': {
      const recGuru = record ? String(record.nama_guru || '').trim().toLowerCase() : '';
      return recGuru ? recGuru === nama : role.includes('guru');
    }
    case 'absen': {
      const recGuru = record ? String(record.nama_guru || '').trim().toLowerCase() : '';
      return recGuru ? recGuru === nama : (role.includes('guru') || role.includes('wali'));
    }
    case 'wali': {
      const recWali = record ? String(record.nama_wali_kelas || '').trim().toLowerCase() : '';
      return recWali ? recWali === nama : (role.includes('wali') || role.includes('guru'));
    }
    case 'guruwali': {
      const recGw = record ? String(record.nama_guru_wali || '').trim().toLowerCase() : '';
      return recGw ? recGw === nama : (role.includes('guru wali') || role.includes('guru'));
    }
    case 'ekstra': {
      const recEkstra = record ? String(record.pembina_ekstra || '').trim().toLowerCase() : '';
      return recEkstra ? (recEkstra === nama || recEkstra.includes(nama)) : (role.includes('pembina') || role.includes('guru'));
    }
    default: 
      return true;
  }
}

// === AUTO-HIDING NAVBAR ===
document.addEventListener('DOMContentLoaded', function() {
  let lastScrollTop = 0;
  const header = document.querySelector('.main-header');
  
  if (header) {
    window.addEventListener('scroll', function() {
      const currentScroll = window.pageYOffset || document.documentElement.scrollTop;
      if (currentScroll > 70) {
        header.classList.add('scrolled');
        if (currentScroll > lastScrollTop && currentScroll > 120) {
          header.classList.add('navbar-hidden');
        } else {
          header.classList.remove('navbar-hidden');
        }
      } else {
        header.classList.remove('scrolled');
        header.classList.remove('navbar-hidden');
      }
      lastScrollTop = currentScroll <= 0 ? 0 : currentScroll;
    }, { passive: true });
  }

  // Sidebar Toggle
  const btnToggle = document.getElementById('btnToggleSidebar');
  const sidebar = document.querySelector('.main-sidebar');
  const closeBtn = document.getElementById('sidebarCloseBtn');

  if (window.innerWidth >= 992 && localStorage.getItem('siguru_sidebar_collapsed') === 'true') {
    document.body.classList.add('sidebar-collapsed');
  }

  if (btnToggle) {
    btnToggle.addEventListener('click', function(e) {
      e.preventDefault();
      if (window.innerWidth < 992) {
        if (sidebar) sidebar.classList.toggle('show');
      } else {
        const isCollapsed = document.body.classList.toggle('sidebar-collapsed');
        localStorage.setItem('siguru_sidebar_collapsed', isCollapsed ? 'true' : 'false');
      }
    });
  }

  if (closeBtn && sidebar) {
    closeBtn.addEventListener('click', function() { sidebar.classList.remove('show'); });
  }

  // Refresh Button (Gunakan navigasi aman _top agar tidak blank putih)
  const refreshBtn = document.getElementById('btnRefreshApp');
  if (refreshBtn) {
    refreshBtn.addEventListener('click', function(e) {
      e.preventDefault();
      if (typeof invalidateAppBundle === 'function') invalidateAppBundle();
      showToast('info', 'Memuat ulang data...');
      setTimeout(function() {
        reloadCurrentAppPage();
      }, 350);
    });
  }

  // Clear Cache Button (Gunakan reloadCurrentAppPage agar tidak blank putih)
  const clearCacheBtn = document.getElementById('btnClearCache');
  if (clearCacheBtn) {
    clearCacheBtn.addEventListener('click', function(e) {
      e.preventDefault();
      try {
        sessionStorage.clear();
        localStorage.removeItem('siguru_cache');
        localStorage.removeItem('siguru_app_bundle');
        if (typeof invalidateAppBundle === 'function') invalidateAppBundle();
      } catch(err) {}
      Swal.fire({
        icon: 'success', title: 'Cache Berhasil Dibersihkan!',
        text: 'Memuat data segar...', toast: true, position: 'top-end',
        showConfirmButton: false, timer: 1000, timerProgressBar: true
      });
      setTimeout(function() {
        reloadCurrentAppPage();
      }, 500);
    });
  }

  // Real-Time Clock
  function updateClock() {
    const dateEl = document.getElementById('headerDeviceDate');
    const timeEl = document.getElementById('headerDeviceTime');
    if (!dateEl && !timeEl) return;
    
    const now = new Date();
    const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    
    if (dateEl) {
      dateEl.textContent = days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
    }
    if (timeEl) {
      timeEl.textContent = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
    }
  }
  updateClock();
  setInterval(updateClock, 1000);

  // Trigger update sidebar & header saat AppJS selesai dimuat
  if (typeof window.renderSidebarMenu === 'function') window.renderSidebarMenu();
  if (typeof window.renderHeader === 'function') window.renderHeader();
});

// === TOAST NOTIFICATIONS ===
function showToast(icon, title, text) {
  Swal.fire({
    icon: icon, title: title, text: text || '',
    toast: true, position: 'top-end',
    showConfirmButton: false, timer: 2500, timerProgressBar: true
  });
}

function showLoading(text) {
  Swal.fire({
    title: text || 'Memproses...', allowOutsideClick: false,
    showConfirmButton: false,
    didOpen: function() { Swal.showLoading(); }
  });
}

// === FORMAT HELPERS ===
function formatDateIndo(dateStr) {
  if (!dateStr) return '-';
  const bulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return dateStr;
  return d.getDate() + ' ' + bulan[d.getMonth()] + ' ' + d.getFullYear();
}

function formatNISN(nisn) {
  if (!nisn) return '';
  const clean = String(nisn).replace(/\D/g, '');
  return clean.padStart(10, '0');
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// === UNIVERSAL EXCEL (.XLSX / .XLS) & CSV HELPERS ===

// 1. Ekspor Array of Objects ke Excel (.xlsx)
function exportArrayToExcel(dataArray, filename, sheetName) {
  if (!dataArray || dataArray.length === 0) {
    showToast('info', 'Tidak ada data untuk diekspor');
    return;
  }
  const cleanName = filename.replace(/\.(xlsx|xls|csv)$/i, '');
  if (typeof XLSX !== 'undefined') {
    const ws = XLSX.utils.json_to_sheet(dataArray);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetName || 'Data');
    XLSX.writeFile(wb, cleanName + '.xlsx');
    showToast('success', 'File Excel berhasil diunduh!');
  } else {
    exportArrayToCSV(dataArray, cleanName + '.csv');
  }
}

// 2. Ekspor Tabel HTML ke Excel (.xlsx)
function exportTableToExcel(tableId, filename, sheetName) {
  const table = document.getElementById(tableId);
  if (!table) return;
  const cleanName = filename.replace(/\.(xlsx|xls|csv)$/i, '');
  if (typeof XLSX !== 'undefined') {
    const wb = XLSX.utils.table_to_book(table, { sheet: sheetName || 'Data' });
    XLSX.writeFile(wb, cleanName + '.xlsx');
    showToast('success', 'File Excel berhasil diunduh!');
  } else {
    exportTableToCSV(tableId, cleanName + '.csv');
  }
}

// 3. Unduh Template Resmi dalam Format Excel (.xlsx)
function downloadExcelTemplate(headers, sampleRows, filename, sheetName) {
  const cleanName = filename.replace(/\.(xlsx|xls|csv)$/i, '');
  if (typeof XLSX !== 'undefined') {
    const wsData = [headers, ...sampleRows];
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetName || 'Template');
    XLSX.writeFile(wb, cleanName + '.xlsx');
  } else {
    let csv = '\uFEFF' + headers.join(',') + '\n';
    sampleRows.forEach(function(r) {
      csv += r.map(function(v){ return '"' + String(v || '').replace(/"/g, '""') + '"'; }).join(',') + '\n';
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = cleanName + '.csv';
    link.click();
  }
}

// 4. Pembaca Berkas Excel (.xlsx, .xls) dan CSV Multifungsi
function readExcelOrCsvFile(file, callback, errorCallback) {
  if (!file) return;
  if (typeof XLSX !== 'undefined') {
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        callback(rows);
      } catch(err) {
        if (typeof errorCallback === 'function') errorCallback(err);
        else showToast('error', 'Gagal membaca berkas Excel: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  } else {
    const reader = new FileReader();
    reader.onload = function(e) {
      const text = e.target.result;
      const lines = text.split(/\r\n|\n/).filter(function(l){ return l.trim().length > 0; });
      const rows = lines.map(function(line){ return parseCsvLineFallback(line); });
      callback(rows);
    };
    reader.readAsText(file);
  }
}

function parseCsvLineFallback(text) {
  const re_value = /(?!\s*$)\s*(?:"([^"]*(?:""[^"]*)*)"|([^,\"]*))\s*(?:,|$)/g;
  const a = [];
  text.replace(re_value, function(m0, m1, m2) {
    if (m1 !== undefined) a.push(m1.replace(/""/g, '"'));
    else if (m2 !== undefined) a.push(m2);
    return '';
  });
  return a;
}

function exportArrayToCSV(dataArray, filename) {
  if (!dataArray || dataArray.length === 0) return;
  const headers = Object.keys(dataArray[0]);
  let csv = '\uFEFF' + headers.join(',') + '\n';
  dataArray.forEach(function(row) {
    csv += headers.map(function(h){ return '"' + String(row[h] !== undefined ? row[h] : '').replace(/"/g, '""') + '"'; }).join(',') + '\n';
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename || 'export.csv';
  link.click();
}

function exportTableToCSV(tableId, filename) {
  const table = document.getElementById(tableId);
  if (!table) return;
  let csv = [];
  const rows = table.querySelectorAll('tr');
  rows.forEach(function(row) {
    const cols = row.querySelectorAll('td, th');
    const rowData = [];
    cols.forEach(function(col) {
      let text = col.textContent.replace(/"/g, '""').trim();
      rowData.push('"' + text + '"');
    });
    csv.push(rowData.join(','));
  });
  const blob = new Blob(['\uFEFF' + csv.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename || 'export.csv';
  link.click();
}

// === FILE UPLOAD & REPLACEMENT HELPER ===
function extractDriveFolderId(url) {
  if (!url) return null;
  const m = String(url).match(/folders\/([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}

// === MULTI-FILE & MULTI-EVIDENCE LINK UTILITIES ===

function parseBuktiLinks(raw) {
  if (!raw) return [];
  if (Array.isArray(raw)) return raw.filter(Boolean);
  const str = String(raw).trim();
  if (!str || str === '-' || str === 'null' || str === 'undefined' || str === '[]') return [];
  if (str.startsWith('[') && str.endsWith(']')) {
    try {
      const arr = JSON.parse(str);
      if (Array.isArray(arr)) return arr.filter(Boolean);
    } catch(e) {}
  }
  return str.split(/[\n;,]+/).map(function(s){ return s.trim(); }).filter(function(s){
    return s && s !== '-' && s !== 'null' && s !== 'undefined' && s.length > 5;
  });
}

function renderBuktiButtons(rawLinks, customClass) {
  const links = parseBuktiLinks(rawLinks);
  if (!links || links.length === 0) return '<span class="text-muted small">-</span>';

  const cClass = customClass || 'btn-outline-info';
  if (links.length === 1) {
    return '<a href="' + escapeHtml(links[0]) + '" target="_blank" class="btn ' + cClass + ' btn-sm btn-bukti" title="Buka berkas bukti di Google Drive">' +
      '<i class="bi bi-link-45deg me-1"></i>Bukti' +
      '</a>';
  }

  let html = '<div class="d-flex flex-wrap gap-1 justify-content-center">';
  links.forEach(function(link, i) {
    html += '<a href="' + escapeHtml(link) + '" target="_blank" class="btn ' + cClass + ' btn-sm btn-bukti" title="Buka berkas bukti ke-' + (i + 1) + '">' +
      '<i class="bi bi-file-earmark-arrow-down me-1"></i>Bukti ' + (i + 1) +
      '</a>';
  });
  html += '</div>';
  return html;
}

function renderBuktiChipsPreview(targetInputId, containerId) {
  const targetInput = document.getElementById(targetInputId);
  const container = document.getElementById(containerId);
  if (!container) return;

  const links = targetInput ? parseBuktiLinks(targetInput.value) : [];
  if (links.length === 0) {
    container.innerHTML = '';
    return;
  }

  let html = '';
  links.forEach(function(link, idx) {
    const num = idx + 1;
    html += '<span class="badge bg-light text-dark border p-2 d-inline-flex align-items-center gap-2 shadow-xs" style="font-size:0.8rem; font-weight:500;">' +
      '<i class="bi bi-file-earmark-check text-primary"></i>' +
      '<a href="' + escapeHtml(link) + '" target="_blank" class="text-decoration-none text-primary fw-semibold" title="Buka file ini">' +
        'Bukti ' + num + ' <i class="bi bi-box-arrow-up-right ms-1" style="font-size:0.7rem;"></i>' +
      '</a>' +
      '<button type="button" class="btn-close ms-1" style="font-size:0.58rem;" onclick="removeBuktiChip(\'' + targetInputId + '\', \'' + containerId + '\', ' + idx + ')" title="Hapus berkas ini"></button>' +
    '</span>';
  });
  container.innerHTML = html;
}

function removeBuktiChip(targetInputId, containerId, removeIdx) {
  const targetInput = document.getElementById(targetInputId);
  if (!targetInput) return;
  const links = parseBuktiLinks(targetInput.value);
  if (removeIdx >= 0 && removeIdx < links.length) {
    links.splice(removeIdx, 1);
    targetInput.value = links.join(' ; ');
    renderBuktiChipsPreview(targetInputId, containerId);
    showToast('info', 'Berkas bukti dihapus dari pilihan.');
  }
}

function uploadMultipleFilesClient(fileInput, targetInputId, folderIdOrKey, previewContainerId) {
  if (!fileInput.files || fileInput.files.length === 0) return;
  const files = Array.from(fileInput.files);
  const total = files.length;

  const DEFAULT_DRIVE_FOLDERS = {
    folder_jurnal: '1g1iaALpfRo8oovkJNoPxy_MIDLv5axEB',
    folder_foto: '1PmA4EHMEVfgbup9ZJuBrIlFzg37gsQO3',
    folder_guru_wali: '12RUHlItCa8smp58-aixHOTWHld21md9_',
    folder_bimbingan: '12RUHlItCa8smp58-aixHOTWHld21md9_',
    folder_wali: '1uNSsLv2rUUC1c_ykBhnkzQ7y43DRxaDj',
    folder_ekstra: '1Jf8BcS1jHO1wUYCzk6dQi9_sy7BRyroM'
  };

  let folderId = '';
  if (typeof folderIdOrKey === 'string') {
    if (folderIdOrKey.startsWith('http') || folderIdOrKey.includes('/folders/')) {
      folderId = extractDriveFolderId(folderIdOrKey);
    } else if (folderIdOrKey.startsWith('folder_')) {
      const bundle = (typeof getAppBundle === 'function') ? getAppBundle() : null;
      if (bundle && bundle.settings) {
        if (bundle.settings[folderIdOrKey]) {
          folderId = extractDriveFolderId(bundle.settings[folderIdOrKey]);
        } else if ((folderIdOrKey === 'folder_bimbingan' || folderIdOrKey === 'folder_guru_wali') && (bundle.settings.folder_guru_wali || bundle.settings.folder_bimbingan)) {
          folderId = extractDriveFolderId(bundle.settings.folder_guru_wali || bundle.settings.folder_bimbingan);
        }
      }
      if (!folderId && DEFAULT_DRIVE_FOLDERS[folderIdOrKey]) {
        folderId = DEFAULT_DRIVE_FOLDERS[folderIdOrKey];
      }
    } else {
      folderId = folderIdOrKey;
    }
  }

  // Fallback cerdas berdasarkan nama folder jika belum terisi
  if (!folderId && typeof folderIdOrKey === 'string') {
    const keyLower = folderIdOrKey.toLowerCase();
    if (keyLower.includes('jurnal')) folderId = DEFAULT_DRIVE_FOLDERS.folder_jurnal;
    else if (keyLower.includes('guru_wali') || keyLower.includes('bimbingan')) folderId = DEFAULT_DRIVE_FOLDERS.folder_guru_wali;
    else if (keyLower.includes('wali')) folderId = DEFAULT_DRIVE_FOLDERS.folder_wali;
    else if (keyLower.includes('ekstra')) folderId = DEFAULT_DRIVE_FOLDERS.folder_ekstra;
    else if (keyLower.includes('foto')) folderId = DEFAULT_DRIVE_FOLDERS.folder_foto;
  }

  if (!folderId) {
    showToast('warning', 'Folder Google Drive belum dikonfigurasi di Pengaturan');
    return;
  }

  const targetInput = document.getElementById(targetInputId);
  const existingUrls = targetInput ? parseBuktiLinks(targetInput.value) : [];

  let currentIndex = 0;
  const newUrls = [];

  function uploadNext() {
    if (currentIndex >= total) {
      Swal.close();
      const combined = existingUrls.concat(newUrls);
      const uniqueCombined = [...new Set(combined)];
      if (targetInput) {
        targetInput.value = uniqueCombined.join(' ; ');
      }
      if (previewContainerId) {
        renderBuktiChipsPreview(targetInputId, previewContainerId);
      }
      showToast('success', total + ' berkas berhasil diunggah ke Google Drive!');
      fileInput.value = '';
      return;
    }

    const file = files[currentIndex];
    showLoading('Mengunggah berkas ' + (currentIndex + 1) + ' dari ' + total + ' (' + escapeHtml(file.name) + ')...');

    const reader = new FileReader();
    reader.onload = function(e) {
      const base64Data = e.target.result.split(',')[1];
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success) {
            newUrls.push(res.url);
          } else {
            console.warn('Gagal unggah berkas:', file.name, res ? res.message : '');
          }
          currentIndex++;
          uploadNext();
        })
        .withFailureHandler(function(err) {
          console.error('Error unggah berkas:', file.name, err);
          currentIndex++;
          uploadNext();
        })
        .uploadFileToDrive(base64Data, file.name, folderId);
    };
    reader.readAsDataURL(file);
  }

  uploadNext();
}

function uploadReplacementFile(input, targetInputId, folderKey, previewContainerId) {
  uploadMultipleFilesClient(input, targetInputId, folderKey, previewContainerId);
}
</script>
