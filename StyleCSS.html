<script>
  window.SIGURU_SCRIPT_URL = "<?= (typeof scriptUrl !== 'undefined' && scriptUrl) ? scriptUrl : '' ?>";
  window.SIGURU_CURRENT_PAGE = "<?= (typeof currentPage !== 'undefined' && currentPage) ? currentPage : '' ?>";
  window.SIGURU_AUTH = "<?= (typeof params !== 'undefined' && params && params.auth) ? params.auth : '' ?>";
  window.SIGURU_PARAMS = { auth: window.SIGURU_AUTH };
  
  if (window.SIGURU_SCRIPT_URL && window.SIGURU_SCRIPT_URL.indexOf('script.google.com') !== -1) {
    try { localStorage.setItem('siguru_script_url', window.SIGURU_SCRIPT_URL); } catch(e) {}
  }

  // === INSTANT AUTH & RBAC SECURITY GUARD ===
  // Berjalan seketika di <head> sebelum browser menampilkan DOM (0 flicker & anti-bocor)
  (function() {
    var page = (window.SIGURU_CURRENT_PAGE || '').toLowerCase().trim();
    if (!page) {
      try {
        var p = new URLSearchParams(window.location.search).get('page');
        if (p) page = p.toLowerCase().trim();
      } catch(e) {}
    }
    if (!page) return;

    // Halaman publik yang diizinkan tanpa autentikasi
    var publicPages = ['login', 'landing'];
    if (publicPages.indexOf(page) !== -1) return;

    // Baca sesi user dari localStorage
    var user = null;
    try {
      var raw = localStorage.getItem('siguru_user');
      if (raw) user = JSON.parse(raw);
    } catch(e) {}

    function performRedirect(targetPage, authReason) {
      try {
        document.documentElement.style.display = 'none';
      } catch(e) {}

      var base = window.SIGURU_SCRIPT_URL || localStorage.getItem('siguru_script_url') || '';
      var targetUrl = (base && base.indexOf('script.google.com') !== -1)
        ? base + (base.indexOf('?') === -1 ? '?' : '&') + 'page=' + encodeURIComponent(targetPage)
        : '?page=' + encodeURIComponent(targetPage);

      if (authReason) {
        targetUrl += '&auth=' + encodeURIComponent(authReason);
      }

      if (authReason === 'required') {
        try {
          sessionStorage.setItem('siguru_redirect_target', page);
        } catch(e) {}
      }

      try {
        var a = document.createElement('a');
        a.href = targetUrl;
        a.target = '_top';
        (document.body || document.documentElement).appendChild(a);
        a.click();
      } catch(err) {
        try {
          window.top.location.href = targetUrl;
        } catch(e2) {
          window.location.href = targetUrl;
        }
      }
    }

    // 1. Jika belum login atau sesi tidak valid -> lempar ke login
    if (!user || !user.username) {
      performRedirect('login', 'required');
      return;
    }

    // 2. Jika sudah login, validasi Hak Akses (RBAC) per menu
    var role = user.hak_akses || 'Guru';
    var roleLower = String(role).toLowerCase().trim();
    var isSuper = roleLower.indexOf('super admin') !== -1 || roleLower.indexOf('admin') !== -1 || roleLower === 'sadmin';
    var isViewer = roleLower.indexOf('pelihat') !== -1 || roleLower.indexOf('pengawas') !== -1;

    var roles = roleLower.split(',').map(function(r) { return r.trim(); });
    var hasRole = function(rName) { return roles.indexOf(rName.toLowerCase()) !== -1; };
    var hasPembina = roles.some ? roles.some(function(r) { return r.indexOf('pembina') !== -1; }) : (roleLower.indexOf('pembina') !== -1);

    var isAllowed = true;
    if (isSuper) {
      isAllowed = true;
    } else if (isViewer) {
      if (page === 'dashboard') {
        performRedirect('laporan-absen', 'viewer_redirect');
        return;
      }
      isAllowed = (page.indexOf('laporan') === 0 || page === 'print-laporan' || page === 'profil');
    } else {
      switch(page) {
        case 'dashboard':
        case 'profil':
          isAllowed = true;
          break;

        // 1. Grup Master Data
        case 'master-guru':
          isAllowed = false;
          break;
        case 'master-murid':
          isAllowed = hasRole('guru') || hasRole('wali kelas');
          break;
        case 'master-bimbingan':
          isAllowed = hasRole('guru wali');
          break;
        case 'master-ekstra':
          isAllowed = hasRole('pembina ekstra') || hasPembina;
          break;

        // 2. Grup Form Inputan
        case 'form-absen':
        case 'form-jurnal':
          isAllowed = hasRole('guru');
          break;
        case 'form-wali':
          isAllowed = hasRole('wali kelas');
          break;
        case 'form-guruwali':
          isAllowed = hasRole('guru wali');
          break;
        case 'form-ekstra':
          isAllowed = hasRole('pembina ekstra') || hasPembina;
          break;

        // 3. Grup Laporan Hasil
        case 'laporan-absen':
        case 'laporan-jurnal':
          isAllowed = hasRole('guru');
          break;
        case 'laporan-wali':
          isAllowed = hasRole('wali kelas');
          break;
        case 'laporan-guruwali':
          isAllowed = hasRole('guru wali');
          break;
        case 'laporan-ekstra':
          isAllowed = hasRole('pembina ekstra') || hasPembina;
          break;

        // 4. Grup Pengaturan Sistem
        case 'pengaturan':
        case 'user-management':
          isAllowed = false;
          break;

        default:
          isAllowed = true;
      }
    }

    if (!isAllowed) {
      var fallbackDest = isViewer ? 'laporan-absen' : 'dashboard';
      performRedirect(fallbackDest, 'forbidden');
    }
  })();
</script>
