<!-- Header.html - Top Navbar SIGURU -->
<header class="main-header d-flex align-items-center justify-content-between px-3 px-md-4">
  <div class="d-flex align-items-center gap-2 gap-md-3">
    <button id="btnToggleSidebar" class="btn btn-light btn-sm border shadow-xs d-flex align-items-center justify-content-center text-dark" style="width: 32px; height: 32px; border-radius: 6px;" title="Sembunyikan / Tampilkan Menu">
      <i class="bi bi-layout-sidebar-inset fs-6"></i>
    </button>
    <div class="d-flex align-items-center gap-2">
      <img id="headerLogo" src="https://drive.google.com/thumbnail?id=1GUfUommgYjV-cnhU0tTB8kRJy8iXagkI" alt="Logo" class="rounded" style="height: 28px; width: 28px; object-fit: contain;">
      <div>
        <span class="d-none d-md-block fw-bold text-dark mb-0" style="font-size: 0.88rem; line-height: 1.15;" id="headerSchoolName">SIGURU</span>
        <span class="text-secondary small" style="line-height: 1.1; font-size: 0.74rem;">
          SIGURU &bull; <span class="fw-semibold text-dark" id="headerPageTitle">Dashboard</span>
        </span>
      </div>
    </div>
  </div>

  <div class="d-flex align-items-center gap-2">
    <!-- Clock Widget -->
    <div class="d-none d-md-flex header-clock-widget" title="Tanggal & Waktu Perangkat">
      <div class="clock-row">
        <i class="bi bi-calendar3"></i>
        <span id="headerDeviceDate" class="clock-date"></span>
      </div>
      <div class="clock-row" style="margin-top: 1px;">
        <i class="bi bi-clock"></i>
        <span id="headerDeviceTime" class="clock-time"></span>
      </div>
    </div>

    <button type="button" id="btnRefreshApp" class="btn btn-outline-secondary btn-sm shadow-xs d-flex align-items-center justify-content-center" style="width: 32px; height: 32px; border-radius: 6px; padding: 0;" title="Muat Ulang Halaman">
      <i class="bi bi-arrow-clockwise fs-6"></i>
    </button>

    <button type="button" id="btnClearCache" class="btn btn-outline-danger btn-sm shadow-xs d-flex align-items-center justify-content-center" style="width: 32px; height: 32px; border-radius: 6px; padding: 0;" title="Hapus Cache Browser">
      <i class="bi bi-trash3 fs-6"></i>
    </button>

    <!-- User Dropdown -->
    <div class="dropdown position-relative" id="dropdownUserContainer">
      <button type="button" class="btn btn-light btn-sm border px-2 py-1 d-flex align-items-center gap-1 dropdown-toggle shadow-xs" style="height: 32px; border-radius: 6px; cursor: pointer;" id="headerUserBtn" title="Akun" onclick="toggleUserDropdown(event)">
        <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-bold" style="width: 22px; height: 22px; font-size: 0.72rem;" id="headerAvatar">U</div>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow border rounded-3 mt-1 py-1" style="font-size: 0.82rem; min-width: 190px;" id="headerUserDropdownMenu">
        <li class="px-3 py-2 border-bottom bg-light">
          <div class="fw-bold text-dark" id="dropdownUserName">Pengguna</div>
          <div class="small text-muted" style="font-size: 0.74rem;" id="dropdownUserNIP">NIP: -</div>
          <div class="badge bg-primary-subtle text-primary mt-1" id="dropdownUserRole">Guru</div>
        </li>
        <li><a class="dropdown-item py-1" href="javascript:void(0)" onclick="navigateTo('profil')"><i class="bi bi-person-gear me-2 text-primary"></i>Edit Profil</a></li>
        <li id="menuDropdownPengaturan" style="display:none;"><a class="dropdown-item py-1" href="javascript:void(0)" onclick="navigateTo('pengaturan')"><i class="bi bi-gear me-2 text-primary"></i>Pengaturan Sistem</a></li>
        <li id="menuDropdownUser" style="display:none;"><a class="dropdown-item py-1" href="javascript:void(0)" onclick="navigateTo('user-management')"><i class="bi bi-people me-2 text-primary"></i>Manajemen User</a></li>
        <li><hr class="dropdown-divider my-1"></li>
        <li><a class="dropdown-item text-danger py-1" href="javascript:void(0)" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
      </ul>
    </div>
  </div>
</header>

<style>
#dropdownUserContainer {
  position: relative;
}
#headerUserDropdownMenu {
  display: none;
  position: absolute;
  right: 0;
  top: 100%;
  margin-top: 4px;
  z-index: 1060;
}
#headerUserDropdownMenu.show {
  display: block !important;
}
</style>
<script>
function toggleUserDropdown(e) {
  if (e) {
    e.preventDefault();
    e.stopPropagation();
  }
  const menu = document.getElementById('headerUserDropdownMenu');
  if (menu) {
    menu.classList.toggle('show');
  }
}

// Close when clicking anywhere outside
document.addEventListener('click', function(e) {
  const container = document.getElementById('dropdownUserContainer');
  const menu = document.getElementById('headerUserDropdownMenu');
  if (container && menu && !container.contains(e.target)) {
    menu.classList.remove('show');
  }
});
// Fungsi resolver pengguna mandiri untuk header
function getHeaderUser() {
  try {
    if (typeof getCurrentUser === 'function') {
      const u = getCurrentUser();
      if (u) return u;
    }
    const raw = localStorage.getItem('siguru_user');
    return raw ? JSON.parse(raw) : null;
  } catch(e) {
    return null;
  }
}

function updateHeaderUI() {
  const user = getHeaderUser();
  if (user) {
    const av = document.getElementById('headerAvatar');
    const un = document.getElementById('dropdownUserName');
    const nip = document.getElementById('dropdownUserNIP');
    const ur = document.getElementById('dropdownUserRole');
    if (av) av.textContent = (user.nama || 'U').charAt(0).toUpperCase();
    if (un) un.textContent = user.nama || 'Pengguna';
    if (nip) nip.textContent = 'NIP: ' + (user.nip || '-');
    if (ur) ur.textContent = user.hak_akses || 'Guru';
    
    const isSuper = (user.hak_akses === 'Super Admin' || user.hak_akses === 'admin');
    const dp = document.getElementById('menuDropdownPengaturan');
    const du = document.getElementById('menuDropdownUser');
    if (dp) dp.style.display = isSuper ? 'block' : 'none';
    if (du) du.style.display = isSuper ? 'block' : 'none';
  }
  
  // Ambil pengaturan sekolah (Logo & Nama Sekolah)
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run.withSuccessHandler(function(settings) {
      if (settings && settings.logo) {
        const logo = document.getElementById('headerLogo');
        if (logo) logo.src = settings.logo;
      }
      if (settings && settings.nama_sekolah) {
        const title = document.getElementById('headerSchoolName');
        if (title) title.textContent = settings.nama_sekolah;
      }
    }).getSettings();
  }
}

// Jalankan segera (sinkron), saat DOM siap, dan simpan referensi global
updateHeaderUI();
document.addEventListener('DOMContentLoaded', updateHeaderUI);
window.addEventListener('load', updateHeaderUI);
window.renderHeader = updateHeaderUI;
</script>
